<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายการสินค้า - ร้านก๋วยเตี๋ยวเรือ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-img { height: 200px; object-fit: cover; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Noodle Shop</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/">สินค้า</a>
                <a class="nav-link" href="/menu">เมนูอาหาร</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mb-4">รายการสินค้าในสต็อก</h1>
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
            {% for product in products %}
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="{{ product['image'] }}" class="card-img-top product-img" alt="{{ product['name'] }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ product['name'] }} </h5>
                        <p class="card-text text-primary fw-bold">ราคา: {{ product['price'] }} บาท </p>
                        <p class="card-text small text-muted">คงเหลือ: {{ product['stock'] }} ชิ้น </p>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <button class="btn btn-outline-success w-100">เพิ่มลงตะกร้า</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
